# Configuration commune de la plateforme IL-07.
#
# Les services seront ajoutés progressivement, en collaboration
# avec le membre responsable de chaque composant.
#
# Kafka et producteurs : Imane ZORY
# MinIO et Hudi : Mohamed BAILLA
# Spark : Ayoub CHAMMAKH
# Airflow et dashboard : Zainab ERROSSAFI

services:
  # Imane : Kafka
  kafka:
    image: apache/kafka:3.9.1
    container_name: il07-kafka
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

  # Zainab : base PostgreSQL des KPI
  kpi-db:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${KPI_DB_USER:-kpi}
      POSTGRES_PASSWORD: ${KPI_DB_PASSWORD:-kpi}
      POSTGRES_DB: ${KPI_DB_NAME:-kpi}
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"

  # Zainab : orchestration Airflow
  airflow:
    image: apache/airflow:2.9.3
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW_CONN_KPI_DB: postgresql://${KPI_DB_USER:-kpi}:${KPI_DB_PASSWORD:-kpi}@kpi-db:5432/${KPI_DB_NAME:-kpi}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/init_airflow.sh:/opt/airflow/init_airflow.sh
    ports:
      - "8085:8080"
    depends_on:
      - kpi-db
    entrypoint: ["/bin/bash", "/opt/airflow/init_airflow.sh"]

  # Zainab : dashboard Superset
  superset:
    build: ./superset
    env_file:
      - .env
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      - ./superset/init_superset.sh:/app/init_superset.sh
      - ./dashboards/il07_dashboard.zip:/tmp/il07_dashboard.zip
      - superset-data:/app/superset_home
    ports:
      - "8088:8088"
    depends_on:
      - kpi-db
    command: ["/bin/bash", "/app/init_superset.sh"]

volumes:
  kafka_data:
  superset-data: